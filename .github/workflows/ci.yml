name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# 不给任务非必要权限；不上传 .env / 用户数据库
permissions:
  contents: read

env:
  DATABASE_URL: "file:./ci.db"
  NODE_ENV: "test"

jobs:
  verify:
    name: 质量门禁（secret:scan · lint · typecheck · test · migrations · build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: 安装依赖
        run: npm ci
      - name: 运行 verify（secret:scan→lint→typecheck→test→test:migrations→build）
        run: npm run verify

  e2e:
    name: E2E（基础 mock + V2 mock）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: 安装依赖
        run: npm ci
      - name: 安装 Playwright 自带 Chromium
        run: npx playwright install --with-deps chromium
      - name: 构建（供 e2e-server 使用）
        run: npm run build
      - name: 运行 E2E（基础 mock）
        run: npm run test:e2e
        env:
          CI: "true"
      - name: 运行 E2E（V2 mock）
        run: npm run test:e2e:v2
        env:
          CI: "true"
      - name: 失败时上传 Playwright 产物（trace/screenshot/report/log）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
            e2e/**/trace.zip
            e2e/**/screenshot-*.png
          if-no-files-found: ignore
